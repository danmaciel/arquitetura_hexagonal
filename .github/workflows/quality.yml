name: TypeScript Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporary maintenance: update only the npm lockfile with non-breaking audit fixes.
      - name: Apply compatible lockfile security updates
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/hexagonal-quality-baseline-20261105'
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): apply compatible npm security fixes"
            git push origin HEAD:ci/hexagonal-quality-baseline-20261105
          fi

      - name: TypeScript build
        run: npm run build

      - name: Jest tests
        run: npm test -- --runInBand --ci

      - name: npm dependency audit
        run: npm audit --audit-level=high
